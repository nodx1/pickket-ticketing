# claude-team-sync 설정 파일 예시
# 실제 사용 시: cp mcp-team.example.yml ../../mcp-team.yml
# mcp-team.yml은 .gitignore 처리 — 실제 값은 절대 커밋하지 마세요

project: my-project-name
project_root: "/absolute/path/to/project"  # scripts/mcp-hooks/setup.sh가 자동 설정

# 팀원 목록 (이름만 등록, 토큰은 서버에서 별도 발급)
team:
  - name: alice
  - name: bob
  - name: charlie

# 저장소 백엔드
storage:
  backend: sqlite            # sqlite (기본, 팀 1-3명) | redis (프로덕션)
  sqlite_path: ".mcp-dev.db" # SQLite 사용 시 경로 (자동 .gitignore)

  # Redis 사용 시 (backend: redis로 변경)
  # redis_url 은 환경변수로 주입: REDIS_URL=redis://...
  redis_db: 2                # DB0=앱캐시, DB1=Celery → DB2를 MCP 전용으로 분리

# 알림 채널 (실제 토큰/URL은 .env 파일에 저장)
notifications:
  telegram:
    enabled: false
    # .env에 추가:
    # TELEGRAM_BOT_TOKEN=<BotFather 토큰>
    # TELEGRAM_CHAT_ID=<팀 그룹 chat_id>

  slack:
    enabled: false
    # .env에 추가:
    # SLACK_WEBHOOK_URL=https://hooks.slack.com/services/...

  discord:
    enabled: false
    # .env에 추가:
    # DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...

  webhook:
    enabled: false
    # .env에 추가:
    # CUSTOM_WEBHOOK_URL=https://your-endpoint.com/events

# GitHub PR 자동 연결
github:
  enabled: false
  repo: "owner/repo-name"    # 예: "onlywon/pickket-v2"
  # .env에 추가:
  # GITHUB_WEBHOOK_SECRET=<랜덤 시크릿>

# 파일 락 모드
# soft: 충돌 시 경고만 출력, 편집 계속 가능 (기본값, 권장)
# strict: 충돌 시 편집 블로킹 — force_unlock 또는 원 소유자 완료 후 편집 가능
lock_mode: soft

# 이벤트 로그 보관 기간 (타임라인 조회 범위)
event_log_ttl_hours: 48

# 파일 락 TTL (시간 단위)
# 세션 크래시 등으로 락 해제 안 될 때 자동 만료
lock_ttl_hours: 4
