[project]
name = "pickket-engine"
version = "0.1.0"
description = "VCG Allocation Engine - Core math engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
