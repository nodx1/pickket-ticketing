<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>오프라인 · Pickket</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      background: #ffffff; color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      text-align: center;
    }
    .box { max-width: 360px; width: 100%; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { margin: 0; color: #525252; font-size: 15px; line-height: 1.6; }
    .en { margin-top: 6px; font-size: 13px; color: #a3a3a3; }
    button {
      margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: #0a0a0a; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/icons/icon-192.png" alt="Pickket" width="64" height="64" />
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.<br />응모·결제는 연결된 상태에서만 할 수 있어요.</p>
    <p class="en">You're offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
