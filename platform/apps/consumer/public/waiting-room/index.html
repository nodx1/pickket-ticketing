<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickket — 대기 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
      color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .container { text-align: center; max-width: 480px; padding: 2rem; }
    .logo { font-size: 2rem; font-weight: 800; margin-bottom: 2rem; }
    .logo span { color: #6366f1; }
    .position { font-size: 3.5rem; font-weight: 700; color: #6366f1; margin: 1rem 0; }
    .info { color: #a5b4fc; font-size: 1.1rem; margin: 0.5rem 0; }
    .progress-bar { width: 100%; height: 6px; background: #2d2d5e; border-radius: 3px; margin: 2rem 0; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a78bfa); border-radius: 3px; transition: width 0.5s ease; }
    .warning { color: #f59e0b; font-size: 0.9rem; margin-top: 1.5rem; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #6366f180; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PICK<span>KET</span></div>
    <h2>대기열에 진입했습니다</h2>
    <div class="position" id="position">—</div>
    <p class="info">현재 대기 인원: <span id="total">—</span>명</p>
    <p class="info"><span class="spinner"></span>예상 대기 시간: <span id="eta">계산 중</span></p>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width: 0%"></div></div>
    <p class="warning">이 페이지를 닫지 마세요. 순서가 되면 자동으로 이동합니다.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('event_id');
    const userId = params.get('user_id');
    const API_BASE = params.get('api') || '';

    if (!eventId) {
      document.getElementById('position').textContent = 'ERROR';
      document.querySelector('h2').textContent = 'event_id 파라미터가 없습니다';
    }

    let initialPosition = null;

    async function poll() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/waiting-room/status/${eventId}?user_id=${userId}`);
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();

        if (data.is_active && data.token) {
          window.location.href = `/events/${eventId}/purchase?token=${data.token}`;
          return;
        }

        if (initialPosition === null) initialPosition = data.position;

        document.getElementById('position').textContent =
          data.position > 0 ? `${data.position.toLocaleString()}번` : '—';
        document.getElementById('total').textContent =
          data.total_waiting.toLocaleString();

        const eta = data.estimated_wait_seconds;
        if (eta > 60) {
          document.getElementById('eta').textContent = `약 ${Math.ceil(eta / 60)}분`;
        } else if (eta > 0) {
          document.getElementById('eta').textContent = `약 ${eta}초`;
        } else {
          document.getElementById('eta').textContent = '곧 입장합니다';
        }

        if (initialPosition && data.position > 0) {
          const pct = Math.max(0, Math.min(100, ((initialPosition - data.position) / initialPosition) * 100));
          document.getElementById('progress').style.width = pct + '%';
        }
      } catch (e) {
        console.error('Poll error:', e);
      }
    }

    if (eventId) {
      poll();
      setInterval(poll, 2000);
    }
  </script>
</body>
</html>
