name: Cloudflare — MCP Staging DNS 이관

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "실행 확인 (yes 입력)"
        required: true
        type: string

jobs:
  dns-migrate:
    name: mcp-staging.pickket.kr DNS 등록 + mcp.pickket.kr 삭제
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Run DNS migration script
        run: bash infra/cloudflare/mcp-staging-dns.sh

      - name: Verify DNS records
        run: |
          echo "=== 최종 DNS 레코드 확인 ==="
          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=mcp-staging.pickket.kr" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          r = d.get('result', [])
          if r:
              print(f'  ✅ mcp-staging.pickket.kr → {r[0][\"content\"]} (proxied={r[0][\"proxied\"]})')
          else:
              print('  ❌ mcp-staging.pickket.kr 레코드 없음')
          "

          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=mcp.pickket.kr" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          r = d.get('result', [])
          if r:
              print(f'  ⚠️  mcp.pickket.kr 아직 존재: {r[0][\"content\"]}')
          else:
              print('  ✅ mcp.pickket.kr 레코드 없음 (삭제 완료)')
          "
