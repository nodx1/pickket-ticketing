name: Release Gate Nightly

on:
  schedule:
    - cron: "40 17 * * *" # 02:40 KST
  workflow_dispatch:
    inputs:
      with_security:
        description: "Run release gate with security gate included"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-gate-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-release-gate:
    name: Nightly Release Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install backend dev dependencies in backend/.venv
        run: |
          python -m venv backend/.venv
          source backend/.venv/bin/activate
          pip install --upgrade pip
          pip install "./backend[dev]"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        if: github.event.inputs.with_security != 'true'
        run: pnpm test:release-gate

      - name: Run release gate (with security)
        if: github.event.inputs.with_security == 'true'
        run: RELEASE_GATE_WITH_SECURITY=1 pnpm test:release-gate

      - name: Upload release gate dashboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-gate-dashboard
          path: docs/status/PROJECT_HEALTH_DASHBOARD.*

      - name: Upload security report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-gate-security-reports
          path: security-reports/
          if-no-files-found: ignore
