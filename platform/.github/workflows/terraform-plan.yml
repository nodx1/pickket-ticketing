name: Terraform Plan

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "ap-northeast-2"

jobs:
  # ---------------------------------------------------------------------------
  # Validate — fmt + validate on every module
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Validate modules
        run: |
          for dir in infra/terraform/modules/*/; do
            echo "::group::Validating $dir"
            cd "$dir"
            terraform init -backend=false
            terraform validate
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Plan — staging + production (read-only)
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_environment: ${{ matrix.environment }}

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              `infra/terraform/environments/${{ matrix.environment }}/plan.txt`,
              'utf8'
            );

            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n... (truncated)'
              : plan;

            const body = `### Terraform Plan — \`${{ matrix.environment }}\`

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Workflow: \`${{ github.workflow }}\` — Run \`${{ github.run_id }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = `Terraform Plan — \`${{ matrix.environment }}\``;
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
