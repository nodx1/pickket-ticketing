# Pickket Production Docker Compose
# 용도: AWS ECS 장애 시 대체 배포 또는 자체 호스팅 환경
#
# 사용법:
#   cp .env.production.example .env
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# 필수 환경변수: .env 파일 참조

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Primary
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pickket-db-primary
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pickket_prod}
      POSTGRES_USER: ${POSTGRES_USER:-pickket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
      - ./pg-primary-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickket} -d ${POSTGRES_DB:-pickket_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby=on
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c max_connections=200
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_lock_waits=on
        -c idle_in_transaction_session_timeout=30000
        -c statement_timeout=30000

  # ---------------------------------------------------------------------------
  # PostgreSQL Read Replica (선택적)
  # 활성화 방법: docker compose -f infra/docker-compose.prod.yml --profile replica up -d
  # ---------------------------------------------------------------------------
  db-replica:
    image: postgres:16-alpine
    container_name: pickket-db-replica
    profiles: ["replica"]
    environment:
      PGUSER: ${POSTGRES_USER:-pickket}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    entrypoint: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing replica from primary...'
        until pg_isready -h db -p 5432 -U $${PGUSER}; do sleep 2; done
        pg_basebackup -h db -p 5432 -U $${PGUSER} -D /var/lib/postgresql/data -Fp -Xs -P -R
      fi
      exec postgres \
        -c hot_standby=on \
        -c shared_buffers=256MB \
        -c effective_cache_size=512MB \
        -c max_connections=200 \
        -c log_min_duration_statement=500
      "

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pickket-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 100
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI + Uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: pickket-backend
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-pickket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pickket_prod}"
      DATABASE_URL_SYNC: "postgresql://${POSTGRES_USER:-pickket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pickket_prod}"
      DATABASE_READ_URL: "${DATABASE_READ_URL:-}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/1"
    ports:
      - "127.0.0.1:8021:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: pickket-celery-worker
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-pickket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pickket_prod}"
      DATABASE_URL_SYNC: "postgresql://${POSTGRES_USER:-pickket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pickket_prod}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app:celery_app", "inspect", "ping", "--timeout", "10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Beat (Scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: pickket-celery-beat
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 스케줄 파일이 최근 5분 내 갱신되었는지 확인 (단순 존재 검사보다 강력)
      test: ["CMD-SHELL", "find /tmp/celerybeat-schedule -mmin -5 | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Consumer Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: apps/consumer/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.pickket.kr}
        CDN_URL: ${CDN_URL:-}
    container_name: pickket-frontend
    ports:
      - "127.0.0.1:3020:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.pickket.kr}
      CDN_URL: ${CDN_URL:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Admin Frontend (Next.js)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.pickket.kr}
    container_name: pickket-admin
    ports:
      - "127.0.0.1:3022:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.pickket.kr}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (선택적 -- Cloudflare 직접 연결 시 불필요)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: pickket-nginx
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - admin
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

volumes:
  pgdata_primary:
    driver: local
  pgdata_replica:
    driver: local
  redisdata:
    driver: local

networks:
  default:
    name: pickket-prod
    driver: bridge
