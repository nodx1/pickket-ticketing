apiVersion: batch/v1
kind: CronJob
metadata:
  name: pickket-go-retry-order-webhooks
  namespace: pickket-go
  labels:
    app: pickket-go
    component: retry-order-webhooks
spec:
  # 주문 생성과 v2 웹훅 도착 순서가 역전된 pending inbox를 1분마다 재처리한다.
  schedule: "* * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pickket-go
            component: retry-order-webhooks
        spec:
          serviceAccountName: pickket-go-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: retry-order-webhooks
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - >
                  curl --connect-timeout 5 --max-time 75 -fsS -H "Authorization: Bearer $CRON_SECRET"
                  -H "x-cron-timestamp: $(date -u +%FT%TZ)"
                  "$GO_BASE_URL/api/cron/retry-order-webhooks"
              env:
                - name: GO_BASE_URL
                  value: "http://pickket-go.pickket-go.svc.cluster.local:3000"
              envFrom:
                - secretRef:
                    name: pickket-go-stg-secrets
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
