apiVersion: batch/v1
kind: CronJob
metadata:
  name: pickket-go-dispatch-messages
  namespace: pickket-go
  labels:
    app: pickket-go
    component: dispatch-messages
spec:
  # 발송 큐 드레인(1분) — queued 메시지를 클레임해서 실제 발송(NCP). 상시 워커 대체.
  # 미정의 시 조직자가 보낸 단체메시지가 queued 로 잔류해 발송되지 않는다.
  # ⚠️ W5-MSG(2026-07-27) 이후 이 라우트는 **v2 위임 스텁**이다(항상 200 no-op).
  #    실제 드레인 = v2 Celery beat `messaging-dispatch-messages`(60s). 발송 원장이 v2 로
  #    이관돼 go DB 에는 드레인할 큐가 없다. 이 CronJob 은 계약 유지용이며 등록하지 않아도
  #    발송에 영향이 없다 — 대신 **v2 celery beat/worker 가 떠 있는지**를 감시해야 한다.
  schedule: "* * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pickket-go
            component: dispatch-messages
        spec:
          serviceAccountName: pickket-go-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: dispatch-messages
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - >
                  curl --connect-timeout 5 --max-time 75 -fsS -H "Authorization: Bearer $CRON_SECRET"
                  -H "x-cron-timestamp: $(date -u +%FT%TZ)"
                  "$GO_BASE_URL/api/cron/dispatch-messages"
              env:
                - name: GO_BASE_URL
                  value: "http://pickket-go.pickket-go.svc.cluster.local:3000"
              envFrom:
                - secretRef:
                    name: pickket-go-stg-secrets
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
# ── CapRover(현행 배포) 대안 ─────────────────────────────────────────────
# k8s 미사용 환경(홈서버 CapRover)에서는 위 CronJob 대신 외부 스케줄러가 1분 주기로 호출:
#   curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
#     -H "x-cron-timestamp: $(date -u +%FT%TZ)" \
#     https://go.pickket.kr/api/cron/dispatch-messages
