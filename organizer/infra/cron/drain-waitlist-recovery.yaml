apiVersion: batch/v1
kind: CronJob
metadata:
  name: pickket-go-drain-waitlist-recovery
  namespace: pickket-go
  labels:
    app: pickket-go
    component: drain-waitlist-recovery
spec:
  # claim-commit 실패로 waitlist_claim_recovery(mig229)에 pending 으로 남은 대기자 전환건을
  # 1분마다 동일 orderId 로 재-commit(멱등 앵커 수렴)한다. 안 돌면 converted_order_id=NULL 영구잔류.
  schedule: "* * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pickket-go
            component: drain-waitlist-recovery
        spec:
          serviceAccountName: pickket-go-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: drain-waitlist-recovery
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              # 라우트의 207(degraded)도 명시적으로 실패 처리해 Kubernetes Job 경보로 전파한다.
              command:
                - sh
                - -c
                - |-
                  response_file="$(mktemp)"
                  trap 'rm -f "$response_file"' EXIT
                  http_code="$(
                    curl --connect-timeout 5 --max-time 75 -sS
                    -o "$response_file" -w '%{http_code}'
                    -H "Authorization: Bearer $CRON_SECRET"
                    -H "x-cron-timestamp: $(date -u +%FT%TZ)"
                    "$GO_BASE_URL/api/cron/drain-waitlist-recovery"
                  )" || {
                    cat "$response_file" >&2
                    exit 1
                  }
                  cat "$response_file"
                  if [ "$http_code" != "200" ]; then
                    echo "drain-waitlist-recovery returned HTTP $http_code" >&2
                    exit 1
                  fi
              env:
                - name: GO_BASE_URL
                  value: "http://pickket-go.pickket-go.svc.cluster.local:3000"
              envFrom:
                - secretRef:
                    name: pickket-go-stg-secrets
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
# ── CapRover(현행 배포) 대안 ─────────────────────────────────────────────
# k8s 미사용 환경(홈서버 CapRover)에서는 위 CronJob 대신 외부 스케줄러가 1분 주기로 호출:
#   curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
#     -H "x-cron-timestamp: $(date -u +%FT%TZ)" \
#     https://go.pickket.kr/api/cron/drain-waitlist-recovery
