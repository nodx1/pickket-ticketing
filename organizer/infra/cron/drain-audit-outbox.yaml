apiVersion: batch/v1
kind: CronJob
metadata:
  name: pickket-go-drain-audit-outbox
  namespace: pickket-go
  labels:
    app: pickket-go
    component: drain-audit-outbox
spec:
  # 상태변경과 동일 txn 으로 적재된 감사(audit) 아웃박스를 1분마다 v2 로 드레인한다.
  schedule: "* * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pickket-go
            component: drain-audit-outbox
        spec:
          serviceAccountName: pickket-go-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: drain-audit-outbox
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |-
                  response_file="$(mktemp)"
                  trap 'rm -f "$response_file"' EXIT
                  http_code="$(
                    curl --connect-timeout 5 --max-time 75 -sS
                    -o "$response_file" -w '%{http_code}'
                    -H "Authorization: Bearer $CRON_SECRET"
                    -H "x-cron-timestamp: $(date -u +%FT%TZ)"
                    "$GO_BASE_URL/api/cron/drain-audit-outbox"
                  )" || {
                    cat "$response_file" >&2
                    exit 1
                  }
                  cat "$response_file"
                  if [ "$http_code" != "200" ]; then
                    echo "drain-audit-outbox returned HTTP $http_code" >&2
                    exit 1
                  fi
              env:
                - name: GO_BASE_URL
                  value: "http://pickket-go.pickket-go.svc.cluster.local:3000"
              envFrom:
                - secretRef:
                    name: pickket-go-stg-secrets
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
