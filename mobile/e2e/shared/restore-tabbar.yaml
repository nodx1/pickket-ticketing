# 탭바 복원 — 스크롤로 숨겨진 AnimatedTabBar를 다시 노출
# 사용: 스크롤 다운 후 탭 전환이 필요할 때 호출
# 방법: 딥링크 + 스와이프 조합으로 확실히 탭바 노출
appId: kr.pickket.app
---

# 1차: 딥링크로 홈 탭 이동 → resetDirection 트리거
- openLink: "pickket:///(tabs)"
- extendedWaitUntil:
    visible:
      id: "tab.index"
    timeout: 5000
    optional: true

# 2차: 스와이프로 강제 스크롤 업 (FlatList 초기 렌더 스크롤 대응)
- runFlow:
    when:
      notVisible:
        id: "tab.index"
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 85%
          duration: 400
      - extendedWaitUntil:
          visible:
            id: "tab.index"
          timeout: 5000
          optional: true

# 3차: 그래도 안 보이면 한번 더 시도 (연속 테스트 시 scroll state 잔류 대응)
- runFlow:
    when:
      notVisible:
        id: "tab.index"
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 90%
          duration: 600
      - extendedWaitUntil:
          visible:
            id: "tab.index"
          timeout: 8000
