# 로그아웃 서브플로우
# 호출 전 조건: 로그인 상태
appId: kr.pickket.app
---

- tapOn:
    id: "tab.me"

- extendedWaitUntil:
    visible:
      id: "me.menu.orders"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: ".*(Logout|로그아웃).*"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: ".*(Logout|로그아웃).*"

- extendedWaitUntil:
    visible:
      text: ".*(Confirm|확인).*"
    timeout: 5000

- tapOn:
    text: ".*(Confirm|확인).*"

- extendedWaitUntil:
    visible:
      id: "me.guest"
    timeout: 5000
